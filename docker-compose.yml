services:

  cdl-docker:
    container_name: cdl-docker
    image: apxangels/cdl-docker:10.0
    network_mode: host
    volumes:
      - ./AppData:/cyberdrop-dl/AppData
      - ./downloads:/cyberdrop-dl/downloads
      - ./URLs.txt:/cyberdrop-dl/URLs.txt:ro
    restart: "no"
    stdin_open: true
    tty: true
    command: ["cyberdrop-dl"]
